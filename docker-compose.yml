# Whole stack: MCP server + Redis (idempotency locks) + Keycloak (tokens) with the realm pre-loaded.
#
#   docker compose up -d --build --wait
#   ./docker/get-token.sh engineering     # prints a token for the read-only engineering tools
#
# Local development only: the client secrets in docker/keycloak/mcp-realm.json and the Keycloak
# admin password are public demo values.

name: spring-boot-mcp-server

services:
  mcp-server:
    build: .
    image: spring-boot-mcp-server:latest
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      OAUTH2_ISSUER_URI: http://keycloak:8081/realms/mcp-realm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MCP_VALIDATE_AUDIENCE: ${MCP_VALIDATE_AUDIENCE:-true}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Published only for `mvn spring-boot:run` on the host; the container stack does not need it.
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # One issuer URL for everyone: the server reaches Keycloak as keycloak:8081 inside Docker,
      # and you reach it as localhost:8081 from this machine. Tokens always say iss=http://keycloak:8081/...
      KC_HTTP_PORT: "8081"
      KC_HOSTNAME: http://keycloak:8081
      KC_HEALTH_ENABLED: "true"
    volumes:
      # Keycloak's folder import needs files named <realm name>-realm.json; the realm is called mcp-realm.
      - ./docker/keycloak/mcp-realm.json:/opt/keycloak/data/import/mcp-realm-realm.json:ro
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      # The Keycloak image has no curl or wget; bash's /dev/tcp reads the readiness endpoint.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
