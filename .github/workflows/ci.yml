name: Spring Boot MCP Server CI

on:
  push:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Unit Tests
        run: mvn -B clean verify

  docker-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start MCP server, Redis and Keycloak
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: End-to-end smoke test (real tokens from Keycloak)
        run: ./docker/smoke-test.sh

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v
