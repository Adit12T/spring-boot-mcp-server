name: Delete merged branches (one-time)
on:
  push:
    paths: [ ".github/workflows/cleanup-branches.yml" ]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for b in boot4 claude/fixes dependabot/github_actions/actions/checkout-7 dependabot/maven/org.springaicommunity-mcp-server-security-0.1.14 dependabot/maven/org.springframework.boot-spring-boot-starter-parent-4.1.2; do
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" && echo "deleted $b" || echo "could not delete $b"
          done
